<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Updated Nav Bar</title>
    <link href="./css/main.css" rel="stylesheet" />
    <script
      src="https://kit.fontawesome.com/732f754b46.js"
      crossorigin="anonymous"
    ></script>
    <script src="./js/nav.js" defer></script>
  </head>
  <body>
    <header class="header">
      <div class="mobile-header">
        <div class="nav-logo">
          <a href="./index.html"
            ><img src="./images/Rainy Days Logo.webp" alt="Rainy Days Logo"
          /></a>
        </div>
        <div class="mobile-nav-icons">
          <a href="#" title="Min konto" aria-label="Min konto"
            ><i class="fa-regular fa-user"></i
          ></a>
          <a href="#" title="Mine favoritter" aria-label="Mine favoritter"
            ><i class="fa-regular fa-heart"></i
          ></a>
          <a href="#" title="Min handlekurv" aria-label="Min handlekurv"
            ><i class="fa-regular fa-credit-card"></i
          ></a>
        </div>
      </div>
      <nav>
        <div class="nav-container">
          <div class="nav-wrapper">
            <div class="nav-hamburger">
              <i class="fa-solid fa-bars"></i>
            </div>
            <div class="search-container">
              <input type="text" placeholder="Søk" name="search" />
              <div class="search-button">
                <button type="submit"><i class="fa fa-search"></i></button>
              </div>
            </div>
            <div class="nav-list-container">
              <div class="nav-list-upper">
                <p class="title bold">Navigasjon</p>
                <div class="nav-exit">
                  <i class="fa-solid fa-xmark"></i>
                </div>
              </div>
              <ul class="nav-list">
                <li><a href="#">Hjem</a></li>
                <li><a href="#">Butikk</a></li>
                <li><a href="#">Om</a></li>
                <li><a href="#">Kontakt</a></li>
              </ul>
            </div>
            <div class="nav-icons">
              <a href="#" title="Min konto" aria-label="Min konto"
                ><i class="fa-regular fa-user"></i
              ></a>
              <a href="#" title="Mine favoritter" aria-label="Mine favoritter"
                ><i class="fa-regular fa-heart"></i
              ></a>
              <a href="#" title="Min handlekurv" aria-label="Min handlekurv"
                ><i class="fa-regular fa-credit-card"></i
              ></a>
            </div>
          </div>
        </div>
      </nav>
    </header>
  </body>
</html>

<i class="fa-solid fa-xmark nav-close"></i>
